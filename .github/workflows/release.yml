name: release

# Push a tag like v1.4.0 → build the Tauri app on Windows, macOS, and Linux
# and publish a single GitHub Release with every platform's installers
# attached. Building on CI (not a local machine) guarantees the shipped
# artifact is the one CI built, closing the "works in dev, white-screen in
# the shipped build" gap. A tag containing '-' (e.g. v1.4.0-rc.1) is
# published as a pre-release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      # Don't cancel the other platforms if one fails — we want to see every
      # platform's result from a single tag push.
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          # One universal dmg that runs on both Intel and Apple Silicon, so
          # users never have to pick the right architecture.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Tauri 2 Linux build deps. webkit2gtk-4.1 is the Tauri 2 line (4.0 is
      # Tauri 1). patchelf + librsvg are needed to bundle the AppImage.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both macOS arch targets are only needed on the macOS runner (for
          # the universal build); the conditional keeps Windows/Linux lean.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # tauri-action runs `tauri build` (which runs beforeBuildCommand
      # `pnpm build`), then creates/updates the release for this tag and
      # uploads each platform's bundles (Windows nsis+msi, macOS dmg,
      # Linux deb+appimage) to the same Release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
